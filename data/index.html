<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Gate Counter File Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="theme-default">
    <header class="header">
        <h1 id="pageTitle">Gate Counter File Manager</h1>
        <p class="subtitle">
            Device: <span id="deviceName">detecting...</span><br>
            Current directory: <span id="currentDir">unknown</span>
        </p>

        <!-- Show Summary button -->
        <div class="form-row" style="justify-content:center; margin-top:0.5rem;">
            <button type="button" class="btn" onclick="window.location='/showSummary.html'">
                View Show Summary
            </button>
        </div>

    </header>

    <main>
        <section class="panel">
            <h2>Available Files</h2>
            <pre id="fileList" class="file-list">
Loading file list...
            </pre>
        </section>

        <section class="panel">
            <h2>File Actions</h2>

            <div class="form-row">
                <label for="fileName">File name:</label>
                <input type="text" id="fileName" placeholder="example.csv">
                <button class="btn" onclick="downloadFile()">Download</button>
                <button class="btn btn-danger" onclick="deleteFile()">Delete</button>
            </div>

            <div class="form-row">
                <label for="renameOld">Rename:</label>
                <input type="text" id="renameOld" placeholder="old-name.csv">
                <span>→</span>
                <input type="text" id="renameNew" placeholder="new-name.bak">
                <button class="btn" onclick="renameFile()">Rename</button>
            </div>
        </section>

        <section class="panel">
            <h2>Upload Files</h2>

            <div class="form-row">
                <input type="file" id="uploadFile">
            </div>
            <div class="form-row">
                <button class="btn" onclick="uploadToCurrent()">Upload to current directory</button>
                <button class="btn" onclick="uploadToData()">Upload to /data (UI files)</button>
            </div>
        </section>

        <section class="panel">
            <h2>Change Directory</h2>

            <div class="form-row">
                <label for="directoryName">Directory:</label>
                <input type="text" id="directoryName" placeholder="/GC/2025">
                <button class="btn" onclick="changeDirectory()">Change</button>
            </div>
        </section>
    </main>

    <script>
        // ----- Identity / theming -----
        function initIdentity() {
            fetch('/identity')
                .then(function (response) { return response.text(); })
                .then(function (text) {
                    var id = text.trim();
                    var body = document.body;
                    var deviceSpan = document.getElementById('deviceName');

                    deviceSpan.textContent = id || 'unknown';

                    if (id === 'espCarCounter' || id === 'CarCounter') {
                        body.classList.remove('theme-default');
                        body.classList.add('theme-car');
                    } else if (id === 'espGateCounter' || id === 'GateCounter') {
                        body.classList.remove('theme-default');
                        body.classList.add('theme-gate');
                    }
                })
                .catch(function (err) {
                    console.error('Error fetching identity:', err);
                    document.getElementById('deviceName').textContent = 'error';
                });
        }

        // ----- File list handling -----
        function parseCurrentDirFromList(text) {
            var firstLine = (text.split('\n')[0] || '');
            var marker = 'Files in ';
            var idx = firstLine.indexOf(marker);
            if (idx === -1) return null;

            var rest = firstLine.substring(idx + marker.length).trim();
            return rest.replace(/:$/, '');
        }

        function fetchFileList() {
            fetch('/listFiles')
                .then(function (response) { return response.text(); })
                .then(function (data) {
                    var fileListEl = document.getElementById('fileList');
                    fileListEl.textContent = data || 'No files reported.';

                    var currentDir = parseCurrentDirFromList(data);
                    if (currentDir) {
                        document.getElementById('currentDir').textContent = currentDir;
                    }
                })
                .catch(function (err) {
                    console.error('Error fetching file list:', err);
                    document.getElementById('fileList').textContent =
                        'Error fetching file list. Check console.';
                });
        }

        // ----- File actions -----
        function deleteFile() {
            var fileName = document.getElementById('fileName').value.trim();
            if (!fileName) {
                alert('Please enter a file name.');
                return;
            }

            if (!confirm('Delete file "' + fileName + '"? This cannot be undone.')) {
                return;
            }

            fetch('/delete?filename=' + encodeURIComponent(fileName))
                .then(function (response) { return response.text(); })
                .then(function (msg) {
                    alert(msg);
                    fetchFileList();
                })
                .catch(function (err) {
                    console.error('Error deleting file:', err);
                    alert('Error deleting file. See console for details.');
                });
        }

        function downloadFile() {
            var fileName = document.getElementById('fileName').value.trim();
            if (!fileName) {
                alert('Please enter a file name.');
                return;
            }
            window.location.href = '/download?filename=' + encodeURIComponent(fileName);
        }

        function renameFile() {
            var oldName = document.getElementById('renameOld').value.trim();
            var newName = document.getElementById('renameNew').value.trim();

            if (!oldName || !newName) {
                alert('Please enter both the old and new file names.');
                return;
            }

            fetch('/rename?old=' + encodeURIComponent(oldName) +
                  '&new=' + encodeURIComponent(newName))
                .then(function (response) { return response.text(); })
                .then(function (msg) {
                    alert(msg);
                    fetchFileList();
                })
                .catch(function (err) {
                    console.error('Error renaming file:', err);
                    alert('Error renaming file. See console for details.');
                });
        }

        // ----- Upload actions -----
        function getSelectedFile() {
            var input = document.getElementById('uploadFile');
            if (!input.files || input.files.length === 0) {
                alert('Please select a file to upload.');
                return null;
            }
            return input.files[0];
        }

        function uploadToCurrent() {
            var file = getSelectedFile();
            if (!file) return;

            var formData = new FormData();
            formData.append('file', file);

            fetch('/upload', {
                method: 'POST',
                body: formData
            })
                .then(function (response) { return response.text(); })
                .then(function (msg) {
                    alert(msg);
                    fetchFileList();
                })
                .catch(function (err) {
                    console.error('Error uploading file:', err);
                    alert('Error uploading file. See console for details.');
                });
        }

        function uploadToData() {
            var file = getSelectedFile();
            if (!file) return;

            var formData = new FormData();
            formData.append('file', file);

            fetch('/uploadToData', {
                method: 'POST',
                body: formData
            })
                .then(function (response) { return response.text(); })
                .then(function (msg) {
                    alert(msg);
                    fetchFileList();
                })
                .catch(function (err) {
                    console.error('Error uploading file to /data:', err);
                    alert('Error uploading to /data. See console for details.');
                });
        }

        // ----- Directory navigation -----
        function changeDirectory() {
            var dir = document.getElementById('directoryName').value.trim();
            if (!dir) {
                alert('Please enter a directory name.');
                return;
            }

            fetch('/changeDirectory?dir=' + encodeURIComponent(dir))
                .then(function (response) { return response.text(); })
                .then(function (msg) {
                    alert(msg);
                    fetchFileList();
                })
                .catch(function (err) {
                    console.error('Error changing directory:', err);
                    alert('Error changing directory. See console for details.');
                });
        }

        // ----- Init -----
        window.onload = function () {
            initIdentity();
            fetchFileList();
        };
    </script>
</body>
</html>
